<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Supabase Google Auth</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; }
    .user-line { display: flex; align-items: center; margin-bottom: 10px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; }
    button { margin: 5px; }
  </style>
</head>
<body>

<h2 id="myInfo">Не авторизован</h2>

<button onclick="login()">Войти через Google</button>
<button onclick="logout()">Выйти</button>

<hr>

<input id="statusText" placeholder="Новый статус">
<input id="statusColor" placeholder="Цвет (например red)">
<button onclick="changeStatus()">Сохранить</button>

<hr>

<div id="groupList"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://ТВОЙ_PROJECT_ID.supabase.co',
  'ТВОЙ_ANON_KEY'
)

let currentUser = null

// 🔐 ЛОГИН
window.login = async () => {
  await supabase.auth.signInWithOAuth({
    provider: 'google'
  })
}

// 🚪 ВЫХОД
window.logout = async () => {
  await supabase.auth.signOut()
  location.reload()
}

// 📊 ПОЛУЧИТЬ ПОЛЬЗОВАТЕЛЯ
async function loadUser() {
  const { data } = await supabase.auth.getUser()
  currentUser = data.user

  if (currentUser) {
    document.getElementById('myInfo').innerText =
      'Ты вошёл как: ' + (currentUser.user_metadata.full_name || currentUser.email)

    await ensureProfile()
  } else {
    document.getElementById('myInfo').innerText = 'Не авторизован'
  }
}

// 🧠 СОЗДАТЬ ПРОФИЛЬ ЕСЛИ НЕТ
async function ensureProfile() {
  const { data } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single()

  if (!data) {
    await supabase.from('profiles').insert({
      id: currentUser.id,
      username: currentUser.user_metadata.full_name || currentUser.email,
      status: 'Онлайн',
      color: 'green'
    })
  }
}

// ✏️ ОБНОВИТЬ СТАТУС
window.changeStatus = async () => {
  if (!currentUser) return alert('Сначала войди')

  const text = document.getElementById('statusText').value
  const color = document.getElementById('statusColor').value

  const { error } = await supabase
    .from('profiles')
    .update({ status: text, color: color })
    .eq('id', currentUser.id)

  if (error) {
    console.error(error)
    alert('Ошибка (скорее всего RLS)')
  } else {
    fetchGroup()
  }
}

// 📋 СПИСОК
async function fetchGroup() {
  const { data, error } = await supabase
    .from('profiles')
    .select('*')
    .order('username', { ascending: true })

  if (error) return console.error(error)

  const list = document.getElementById('groupList')
  list.innerHTML = data.map(user => `
    <div class="user-line">
      <div class="status-dot" style="background:${user.color || '#ccc'}"></div>
      <div>
        <strong>${user.username}</strong><br>
        <small>${user.status || ''}</small>
      </div>
    </div>
  `).join('')
}

// 🚀 INIT
await loadUser()
fetchGroup()
setInterval(fetchGroup, 5000)

</script>
</body>
</html>
