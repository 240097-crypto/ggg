<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Монитор группы</title>

<style>
body {
  font-family: Arial;
  background: #f3f4f6;
  padding: 30px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

h2 {
  margin-top: 0;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.green { background: #28a745; color: white; }
.yellow { background: #ffc107; }
.blue { background: #17a2b8; color: white; }
.gray { background: #6c757d; color: white; }

.user {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid #eee;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 10px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Мой профиль</h2>
  <div id="me">Не авторизован</div>

  <div class="buttons">
    <button class="green" onclick="setStatus('Учусь','green')">📚 Учусь</button>
    <button class="yellow" onclick="setStatus('Кофе-брейк','gold')">☕ Кофе</button>
    <button class="blue" onclick="setStatus('В игре','blue')">🎮 В игре</button>
    <button class="gray" onclick="setStatus('Дома','gray')">🏠 Дома</button>
  </div>
</div>

<div class="card">
  <h2>Монитор группы</h2>
  <div id="list"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://ТВОЙ_PROJECT_ID.supabase.co',
  'ТВОЙ_ANON_KEY'
)

let user = null

// логин
async function login() {
  await supabase.auth.signInWithOAuth({ provider: 'google' })
}

// получить пользователя
async function init() {
  const { data } = await supabase.auth.getUser()
  user = data.user

  if (!user) {
    document.getElementById('me').innerHTML =
      '<button onclick="login()">Войти через Google</button>'
    return
  }

  document.getElementById('me').innerText =
    'Вы зашли как: ' + (user.user_metadata.full_name || user.email)

  await createProfile()
  loadUsers()
}

// создать профиль
async function createProfile() {
  const { data } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .single()

  if (!data) {
    await supabase.from('profiles').insert({
      id: user.id,
      username: user.user_metadata.full_name || user.email,
      status: 'Онлайн',
      color: 'green'
    })
  }
}

// смена статуса
window.setStatus = async (text, color) => {
  if (!user) return alert('Сначала войди')

  await supabase
    .from('profiles')
    .update({ status: text, color: color })
    .eq('id', user.id)

  loadUsers()
}

// список
async function loadUsers() {
  const { data } = await supabase
    .from('profiles')
    .select('*')
    .order('username')

  const list = document.getElementById('list')

  list.innerHTML = data.map(u => `
    <div class="user">
      <div class="dot" style="background:${u.color}"></div>
      <div>
        <b>${u.username}</b><br>
        <small>${u.status}</small>
      </div>
    </div>
  `).join('')
}

init()
setInterval(loadUsers, 5000)

</script>

</body>
</html>
