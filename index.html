<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpace Pro | Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --accent: #8b5cf6; /* Фиолетовый акцент */
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --online: #22c55e;
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg-dark); color: var(--text-main); 
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* Боковая панель (Профиль и Группа) */
        .sidebar { 
            width: 300px; background: #0b0f1a; border-right: 1px solid #1e293b;
            display: flex; flex-direction: column; padding: 24px; flex-shrink: 0;
        }

        .profile-box { 
            background: var(--bg-panel); border-radius: 16px; padding: 20px; 
            margin-bottom: 30px; border: 1px solid #334155;
        }

        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-status { 
            background: #334155; border: none; color: white; padding: 10px; 
            border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s;
        }
        .btn-status:hover { background: var(--accent); transform: translateY(-2px); }

        .user-list { flex-grow: 1; overflow-y: auto; }
        .user-card { 
            display: flex; align-items: center; gap: 12px; padding: 12px; 
            border-radius: 10px; margin-bottom: 4px; transition: 0.2s;
        }
        .user-card:hover { background: #1e293b; }
        
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #475569; position: relative; }
        .dot.active { background: var(--online); box-shadow: 0 0 10px var(--online); }

        /* Основная часть (Чат) */
        .main { flex-grow: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 20px 40px; background: #0b0f1a; border-bottom: 1px solid #1e293b; }
        
        #chat-flow { flex-grow: 1; padding: 30px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { background: var(--bg-panel); padding: 14px 18px; border-radius: 18px; max-width: 65%; align-self: flex-start; line-height: 1.4; }
        .msg b { color: var(--accent); display: block; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .msg.my { align-self: flex-end; background: var(--accent); color: white; }
        .msg.my b { color: #e9d5ff; }

        .input-area { padding: 25px 40px; background: #0b0f1a; display: flex; gap: 15px; }
        input { 
            flex-grow: 1; background: var(--bg-panel); border: 1px solid #334155; 
            color: white; padding: 15px 20px; border-radius: 12px; outline: none; font-size: 15px;
        }
        input:focus { border-color: var(--accent); }
        .btn-send { background: var(--accent); color: white; border: none; padding: 0 30px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-send:hover { opacity: 0.9; }

        /* Окно логина */
        .overlay { position: fixed; inset: 0; background: var(--bg-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
        .login-card { text-align: center; background: var(--bg-panel); padding: 50px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay">
        <div class="login-card">
            <h1 style="margin-bottom:10px">StudySpace</h1>
            <p style="color: var(--text-dim); margin-bottom: 30px">Система мониторинга учебной группы</p>
            <button class="btn-send" style="height: 55px;" onclick="login()">Войти через Google</button>
        </div>
    </div>

    <div class="sidebar">
        <h3 style="margin-top:0; font-size: 14px; color: var(--text-dim); text-transform: uppercase;">Мой профиль</h3>
        <div class="profile-box">
            <div id="user-display-name" style="font-size: 18px; font-weight: 700;">...</div>
            <div id="user-display-status" style="font-size: 13px; color: var(--accent); margin-top: 5px;">Онлайн</div>
            
            <div class="status-grid">
                <button class="btn-status" onclick="updateStatus('📚 Учусь')">📚 Учусь</button>
                <button class="btn-status" onclick="updateStatus('☕ Кофе')">☕ Кофе</button>
                <button class="btn-status" onclick="updateStatus('🎮 В игре')">🎮 В игре</button>
                <button class="btn-status" onclick="updateStatus('😴 Сплю')">😴 Сплю</button>
            </div>
        </div>

        <h3 style="font-size: 14px; color: var(--text-dim); text-transform: uppercase;">Группа сейчас</h3>
        <div id="user-list" class="user-list">
            </div>

        <button onclick="logout()" style="background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; margin-top: 20px; text-decoration: underline;">Выйти из системы</button>
    </div>

    <div class="main">
        <div class="chat-header">
            <h2 style="margin:0; font-size: 20px;">Общий чат</h2>
        </div>
        
        <div id="chat-flow">
            </div>

        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">ОТПРАВИТЬ</button>
        </div>
    </div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // ТВОИ КЛЮЧИ (УЖЕ ВСТАВЛЕНЫ)
    const SUPABASE_URL = 'https://bkowzzsufqlsmfztjjlk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_42HgLx93ne79bncGUZ8kPQ_MSJLxcwn';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    // 1. ИНИЦИАЛИЗАЦИЯ
    async function init() {
        const { data } = await supabase.auth.getUser();
        
        if (data?.user) {
            currentUser = data.user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('user-display-name').innerText = currentUser.user_metadata.full_name || currentUser.email;

            // Работа 1 & 3: Создаем профиль в БД
            await supabase.from('profiles').upsert({ 
                id: currentUser.id, 
                username: currentUser.user_metadata.full_name || currentUser.email 
            });

            // Запускаем "Сердцебиение" (Работа 3)
            sendHeartbeat();
            setInterval(sendHeartbeat, 30000); // Каждые 30 сек отмечаемся в базе

            // Запускаем синхронизацию данных
            refreshData();
            setInterval(refreshData, 5000); // Каждые 5 сек обновляем чат и список
        }
    }

    // 2. АВТОРИЗАЦИЯ
    window.login = () => supabase.auth.signInWithOAuth({ provider: 'google' });
    window.logout = async () => { await supabase.auth.signOut(); location.reload(); };

    // 3. ЧЕСТНЫЙ ОНЛАЙН (HEARTBEAT)
    async function sendHeartbeat() {
        if (currentUser) {
            await supabase.from('profiles')
                .update({ last_seen: new Date().toISOString() })
                .eq('id', currentUser.id);
        }
    }

    // 4. СТАТУСЫ
    window.updateStatus = async (statusText) => {
        await supabase.from('profiles').update({ status: statusText }).eq('id', currentUser.id);
        document.getElementById('user-display-status').innerText = statusText;
        refreshData();
    };

    // 5. ОТПРАВКА СООБЩЕНИЙ (РАБОТА 2 - БД)
    window.sendMessage = async () => {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        
        if (!text) return;

        await supabase.from('messages').insert({
            user_id: currentUser.id,
            username: currentUser.user_metadata.full_name || currentUser.email,
            text: text
        });

        input.value = '';
        refreshData();
    };

    // 6. СИНХРОНИЗАЦИЯ (МОНИТОРИНГ + ЧАТ)
    async function refreshData() {
        // Загрузка пользователей
        const { data: users } = await supabase.from('profiles').select('*').order('username');
        if (users) {
            const listEl = document.getElementById('user-list');
            listEl.innerHTML = users.map(u => {
                // Если сигнал был менее 70 секунд назад - пользователь онлайн
                const isOnline = new Date() - new Date(u.last_seen) < 70000;
                return `
                    <div class="user-card">
                        <div class="dot ${isOnline ? 'active' : ''}"></div>
                        <div>
                            <div class="username">${u.username}</div>
                            <div class="user-status">${u.status || 'Онлайн'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Загрузка чата
        const { data: msgs } = await supabase.from('messages').select('*').order('created_at', { ascending: false }).limit(40);
        if (msgs) {
            const chatEl = document.getElementById('chat-flow');
            const html = msgs.reverse().map(m => `
                <div class="msg ${m.user_id === currentUser.id ? 'my' : ''}">
                    <b>${m.username.split(' ')[0]}</b>
                    ${m.text}
                </div>
            `).join('');
            
            // Сохраняем позицию скролла если мы внизу
            const isAtBottom = chatEl.scrollHeight - chatEl.scrollTop <= chatEl.clientHeight + 100;
            chatEl.innerHTML = html;
            if (isAtBottom) chatEl.scrollTop = chatEl.scrollHeight;
        }
    }

    init();
</script>
</body>
</html>
