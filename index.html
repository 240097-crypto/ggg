<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpace Pro | Dashboard</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --accent: #8b5cf6;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --online: #22c55e;
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg-dark); color: var(--text-main); 
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        .sidebar { 
            width: 300px; background: #0b0f1a; border-right: 1px solid #1e293b;
            display: flex; flex-direction: column; padding: 24px; flex-shrink: 0;
            overflow-y: auto;
        }

        .profile-box { 
            background: var(--bg-panel); border-radius: 16px; padding: 20px; 
            margin-bottom: 20px; border: 1px solid #334155;
        }

        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-status { 
            background: #334155; border: none; color: white; padding: 10px; 
            border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s;
        }
        .btn-status:hover { background: var(--accent); transform: translateY(-2px); }

        /* Стили для таймера */
        .timer-display {
            font-family: monospace;
            font-size: 24px;
            color: var(--accent);
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
        }
        .btn-study-toggle {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 5px;
        }
        .btn-study-start { background: var(--online); color: white; }
        .btn-study-stop { background: #ef4444; color: white; }

        .user-list { margin-bottom: 20px; }
        .user-card { 
            display: flex; align-items: center; gap: 12px; padding: 12px; 
            border-radius: 10px; margin-bottom: 4px; transition: 0.2s; background: rgba(30, 41, 59, 0.3);
        }
        
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #475569; position: relative; }
        .dot.active { background: var(--online); box-shadow: 0 0 10px var(--online); }

        /* Стили рейтинга и достижений */
        .leaderboard-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #1e293b;
            margin-bottom: 20px;
        }
        .leader-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #1e293b;
            font-size: 13px;
        }
        .leader-row:last-child { border-bottom: none; }
        .leader-info { display: flex; align-items: center; gap: 8px; }
        .leader-rank { font-weight: bold; min-width: 20px; color: var(--text-dim); }
        .leader-time { color: var(--online); font-weight: 600; font-size: 12px; }

        .achievements-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .ach-badge {
            background: #334155;
            border-radius: 6px;
            padding: 6px 4px;
            text-align: center;
            font-size: 16px;
            position: relative;
            cursor: help;
            opacity: 0.3;
            filter: grayscale(100%);
            transition: 0.3s;
        }
        .ach-badge.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--accent);
        }
        .ach-badge .tooltip {
            visibility: hidden;
            width: 140px;
            background-color: #0b0f1a;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 10px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .ach-badge:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .main { flex-grow: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 20px 40px; background: #0b0f1a; border-bottom: 1px solid #1e293b; }
        
        #chat-flow { flex-grow: 1; padding: 30px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { background: var(--bg-panel); padding: 14px 18px; border-radius: 18px; max-width: 65%; align-self: flex-start; line-height: 1.4; }
        .msg b { color: var(--accent); display: block; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .msg.my { align-self: flex-end; background: var(--accent); color: white; }

        .input-area { padding: 25px 40px; background: #0b0f1a; display: flex; gap: 15px; }
        input { 
            flex-grow: 1; background: var(--bg-panel); border: 1px solid #334155; 
            color: white; padding: 15px 20px; border-radius: 12px; outline: none; font-size: 15px;
        }
        .btn-send { background: var(--accent); color: white; border: none; padding: 0 30px; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .overlay { position: fixed; inset: 0; background: var(--bg-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
        .login-card { text-align: center; background: var(--bg-panel); padding: 50px; border-radius: 24px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay">
        <div class="login-card">
            <h1 style="margin-bottom:10px">StudySpace</h1>
            <p style="color: var(--text-dim); margin-bottom: 30px">Система мониторинга учебной группы</p>
            <button class="btn-send" style="height: 55px;" onclick="login()">Войти через Google</button>
        </div>
    </div>

    <div class="sidebar">
        <h3 style="margin-top:0; font-size: 14px; color: var(--text-dim); text-transform: uppercase;">Мой профиль</h3>
        <div class="profile-box">
            <div id="user-display-name" style="font-size: 18px; font-weight: 700;">...</div>
            <div style="font-size: 13px; color: var(--accent); margin-top: 5px; display: flex; justify-content: space-between; align-items: center;">
                <span id="user-display-status">Онлайн</span>
                <span id="user-rank-status" style="color: var(--text-dim); font-weight: 600;">Место: --</span>
            </div>
            
            <div id="timer-box">
                <div class="timer-display" id="session-timer">00:00:00</div>
                <button id="study-toggle-btn" class="btn-study-toggle btn-study-start" onclick="toggleStudy()">Начать учёбу</button>
            </div>

            <div class="status-grid">
                <button class="btn-status" onclick="updateStatus('📚 Учусь')">📚 Учусь</button>
                <button class="btn-status" onclick="updateStatus('☕ Кофе')">☕ Кофе</button>
                <button class="btn-status" onclick="updateStatus('🎮 В игре')">🎮 В игре</button>
                <button class="btn-status" onclick="updateStatus('😴 Сплю')">😴 Сплю</button>
            </div>

            <div class="achievements-row" id="my-achievements">
                <div class="ach-badge" id="ach-early"><span class="tooltip"><b>Ранняя пташка</b><br>Зашёл на учёбу до 8:00</span>🌅</div>
                <div class="ach-badge" id="ach-marathon"><span class="tooltip"><b>Марафонец</b><br>Учёба более 2 часов подряд</span>🏃‍♂️</div>
                <div class="ach-badge" id="ach-active"><span class="tooltip"><b>Активист</b><br>Написал более 20 сообщений</span>💬</div>
                <div class="ach-badge" id="ach-first"><span class="tooltip"><b>Первый шаг</b><br>Завершил первую сессию</span>🎓</div>
            </div>
        </div>

        <h3 style="font-size: 14px; color: var(--text-dim); text-transform: uppercase; margin-top: 10px;">🏆 Топ студентов</h3>
        <div class="leaderboard-box" id="leaderboard-list">
            </div>

        <h3 style="font-size: 14px; color: var(--text-dim); text-transform: uppercase;">Группа сейчас</h3>
        <div id="user-list" class="user-list"></div>
        <button onclick="logout()" style="background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; margin-top: auto; text-decoration: underline; padding-bottom: 10px;">Выйти</button>
    </div>

    <div class="main">
        <div class="chat-header"><h2 style="margin:0; font-size: 20px;">Общий чат</h2></div>
        <div id="chat-flow"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">ОТПРАВИТЬ</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://bkowzzsufqlsmfztjjlk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_42HgLx93ne79bncGUZ8kPQ_MSJLxcwn';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let studyInterval = null;
    let currentSessionIsEarly = false; // Маркер для ачивки "Ранняя пташка"

    async function init() {
        const { data: { session } } = await _supabase.auth.getSession();
        
        if (session) {
            currentUser = session.user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('user-display-name').innerText = currentUser.user_metadata.full_name || currentUser.email;

            // Инициализация профиля с базовыми полями аналитики, если их нет
            await _supabase.from('profiles').upsert({ 
                id: currentUser.id, 
                username: currentUser.user_metadata.full_name || currentUser.email 
            });

            // Восстановление состояния таймера при загрузке
            const { data: profile } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if (profile?.is_studying && profile.session_start) {
                startLocalTimer(profile.session_start);
            }

            refreshData();
            setInterval(refreshData, 5000);
            setInterval(async () => {
                await _supabase.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', currentUser.id);
            }, 30000);
        }
    }

    // [ФУНКЦИЯ №1]: Определение места текущего пользователя в рейтинге группы
    async function fetchMyRank() {
        if (!currentUser) return;
        const { data: users, error } = await _supabase.from('profiles').select('id, total_study_time');
        if (!error && users) {
            // Сортируем список всех пользователей по убыванию учебного времени
            users.sort((a, b) => (b.total_study_time || 0) - (a.total_study_time || 0));
            // Находим индекс текущего пользователя в упорядоченном массиве
            const myIndex = users.findIndex(u => u.id === currentUser.id);
            if (myIndex !== -1) {
                document.getElementById('user-rank-status').innerText = `Место: ${myIndex + 1}`;
            }
        }
    }

    // [ФУНКЦИЯ №2]: Проверка условий и моментальное награждение ачивкой "Первый шаг"
    async function checkAndAwardFirstStep(totalSessions) {
        if (!currentUser) return;
        // Если у пользователя завершена ровно одна сессия
        if (totalSessions === 1) {
            await _supabase.from('profiles').update({
                total_sessions: totalSessions
            }).eq('id', currentUser.id);
            
            // Локально подсвечиваем ачивку для мгновенного фидбека
            document.getElementById('ach-first').classList.add('unlocked');
        }
    }

    // Внедренная функция таймера
    window.toggleStudy = async () => {
        const btn = document.getElementById('study-toggle-btn');
        const isStarting = btn.classList.contains('btn-study-start');
        const now = new Date();
        const startTime = isStarting ? now.toISOString() : null;

        // Логика ачивки: Ранняя пташка (запуск до 8 утра)
        if (isStarting && now.getHours() < 8) {
            currentSessionIsEarly = true;
        }

        let updateFields = {
            is_studying: isStarting,
            session_start: startTime,
            status: isStarting ? '📚 Учусь' : 'Онлайн'
        };

        // Если останавливаем учебу, сохраняем агрегированную метрику времени
        if (!isStarting) {
            const { data: p } = await _supabase.from('profiles').select('session_start, total_study_time, total_sessions, ach_marathon, ach_early').eq('id', currentUser.id).single();
            if (p && p.session_start) {
                const diffMinutes = Math.floor((new Date() - new Date(p.session_start)) / 60000);
                const newTotalTime = (p.total_study_time || 0) + diffMinutes;
                const newTotalSessions = (p.total_sessions || 0) + 1;
                
                updateFields.total_study_time = newTotalTime;
                updateFields.total_sessions = newTotalSessions;

                // Проверка на ачивку "Марафонец" (учёба более 2 часов = 120 минут непрерывно)
                if (diffMinutes >= 120) {
                    updateFields.ach_marathon = true;
                }
                // Запись рекорда ранней пташки
                if (currentSessionIsEarly) {
                    updateFields.ach_early = true;
                    currentSessionIsEarly = false;
                }

                // Вызов функции №2 для проверки ачивки "Первый шаг"
                await checkAndAwardFirstStep(newTotalSessions);
            }
        }

        const { error } = await _supabase.from('profiles').update(updateFields).eq('id', currentUser.id);

        if (!error) {
            if (isStarting) {
                startLocalTimer(startTime);
                document.getElementById('user-display-status').innerText = '📚 Учусь';
            } else {
                stopLocalTimer();
                document.getElementById('user-display-status').innerText = 'Онлайн';
            }
            refreshData();
        }
    };

    function startLocalTimer(startTime) {
        const btn = document.getElementById('study-toggle-btn');
        btn.innerText = "Остановить";
        btn.classList.replace('btn-study-start', 'btn-study-stop');
        
        clearInterval(studyInterval);
        studyInterval = setInterval(() => {
            const diff = Math.floor((new Date() - new Date(startTime)) / 1000);
            const h = Math.floor(diff / 3600).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            document.getElementById('session-timer').innerText = `${h}:${m}:${s}`;
            
            // Если прямо во время текущей сессии набежало 2 часа, подсветим локально
            if (diff >= 7200) {
                document.getElementById('ach-marathon').classList.add('unlocked');
            }
        }, 1000);
    }

    function stopLocalTimer() {
        const btn = document.getElementById('study-toggle-btn');
        clearInterval(studyInterval);
        btn.innerText = "Начать учёбу";
        btn.classList.replace('btn-study-stop', 'btn-study-start');
        document.getElementById('session-timer').innerText = "00:00:00";
    }

    window.login = () => _supabase.auth.signInWithOAuth({ 
        provider: 'google',
        options: { redirectTo: 'https://240097-crypto.github.io/ggg/' }
    });

    window.logout = async () => { await _supabase.auth.signOut(); location.reload(); };

    window.updateStatus = async (statusText) => {
        if (statusText !== '📚 Учусь') stopLocalTimer();
        
        await _supabase.from('profiles').update({ 
            status: statusText,
            is_studying: statusText === '📚 Учусь' 
        }).eq('id', currentUser.id);
        
        document.getElementById('user-display-status').innerText = statusText;
        refreshData();
    };

    window.sendMessage = async () => {
        const input = document.getElementById('msgInput');
        if (!input.value.trim()) return;
        
        // Отправляем сообщение
        await _supabase.from('messages').insert({
            user_id: currentUser.id,
            username: currentUser.user_metadata.full_name || currentUser.email,
            text: input.value
        });

        // Инкрементируем счетчик сообщений пользователя для ачивки "Активист"
        const { data: p } = await _supabase.from('profiles').select('msg_count').eq('id', currentUser.id).single();
        const currentMsgs = (p?.msg_count || 0) + 1;
        
        await _supabase.from('profiles').update({
            msg_count: currentMsgs,
            ach_active: currentMsgs >= 20
        }).eq('id', currentUser.id);

        input.value = '';
        refreshData();
    };

    async function refreshData() {
        // Запрос пользователей с сортировкой по времени учебы для ТОПа
        const { data: users } = await _supabase.from('profiles').select('*').order('username');
        
        if (users) {
            // Вызов функции №1 при каждом цикле обновления
            fetchMyRank();

            // 1. Рендеринг списка "Группа сейчас"
            document.getElementById('user-list').innerHTML = users.map(u => {
                const isOnline = new Date() - new Date(u.last_seen) < 70000;
                
                let studyTag = "";
                if (u.is_studying && u.session_start) {
                    const mins = Math.floor((new Date() - new Date(u.session_start)) / 60000);
                    studyTag = ` <span style="color:var(--accent)">📖 ${mins}м</span>`;
                }

                return `
                    <div class="user-card">
                        <div class="dot ${isOnline ? 'active' : ''}"></div>
                        <div>
                            <div class="username">${u.username}${studyTag}</div>
                            <div style="font-size:12px;color:var(--accent)">${u.status || 'Онлайн'}</div>
                        </div>
                    </div>`;
            }).join('');

            // 2. Рендеринг блока "🏆 Топ студентов"
            const sortedLeaders = [...users].sort((a, b) => (b.total_study_time || 0) - (a.total_study_time || 0));
            
            document.getElementById('leaderboard-list').innerHTML = sortedLeaders.slice(0, 5).map((u, index) => {
                let rankIcon = index + 1;
                if (index === 0) rankIcon = "🥇";
                if (index === 1) rankIcon = "🥈";
                if (index === 2) rankIcon = "🥉";

                const totalMin = u.total_study_time || 0;
                const h = Math.floor(totalMin / 60);
                const m = totalMin % 60;
                const timeString = h > 0 ? `${h}ч ${m}м` : `${m}м`;

                return `
                    <div class="leader-row">
                        <div class="leader-info">
                            <span class="leader-rank">${rankIcon}</span>
                            <span>${u.username}</span>
                        </div>
                        <span class="leader-time">${timeString}</span>
                    </div>
                `;
            }).join('');

            // 3. Обновление состояния достижений текущего пользователя на панели
            const me = users.find(u => u.id === currentUser.id);
            if (me) {
                if (me.ach_early) document.getElementById('ach-early').classList.add('unlocked');
                if (me.ach_marathon) document.getElementById('ach-marathon').classList.add('unlocked');
                if (me.ach_active || me.msg_count >= 20) document.getElementById('ach-active').classList.add('unlocked');
                if (me.total_sessions > 0) document.getElementById('ach-first').classList.add('unlocked');
            }
        }

        // Рендеринг чата
        const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: false }).limit(40);
        if (msgs) {
            const chatEl = document.getElementById('chat-flow');
            chatEl.innerHTML = msgs.reverse().map(m => `
                <div class="msg ${m.user_id === currentUser.id ? 'my' : ''}">
                    <b style="font-size:10px">${m.username}</b>${m.text}
                </div>
             `).join('');
            chatEl.scrollTop = chatEl.scrollHeight;
        }
    }

    window.onload = init;
</script>
</body>
</html>
